name: explorer-api

on:
  push:
    paths:
      - "explorer/api/**"
      - "data/processed/monthly_panel_clean.csv"
      - "reports/*_forecast.csv"
      - ".github/workflows/explorer-api.yml"
  pull_request:
    paths:
      - "explorer/api/**"
      - "data/processed/monthly_panel_clean.csv"
      - "reports/*_forecast.csv"
      - ".github/workflows/explorer-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: explorer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/explorer_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: explorer/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ni-airports-explorer-api explorer/api
